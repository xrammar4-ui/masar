<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>مشاهدة | مسار</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="rtl">
  <nav class="navbar" id="navbar"></nav>

  <div class="player-wrap">
    <a href="index.html" id="backLink" style="display:inline-block;margin-bottom:1rem;color:#64748b;font-size:0.9rem;font-weight:600"></a>

    <div class="player-box" id="playerBox">
      <div class="player-bar">
        <button class="fs-icon-btn" onclick="toggleFs()" id="fsBtn" title="تكبير الشاشة">
          <svg id="fsIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="info-card">
      <span class="badge" id="badge"></span>
      <div style="display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.5rem;font-size:0.9rem;color:#64748b">
        <span id="showName" style="color:var(--primary-600);font-weight:600"></span>
        <span>•</span>
        <span id="duration"></span>
        <span>•</span>
        <span id="views"></span>
      </div>
      <h1 id="title"></h1>
      <p id="desc" style="color:#475569;margin-bottom:0.75rem"></p>
      <div style="font-size:0.9rem;color:#64748b" id="host"></div>
    </div>

    <h2 id="relatedTitle" style="font-size:1.25rem;font-weight:800;margin:2rem 0 1rem"></h2>
    <div class="podcast-grid" id="relatedGrid"></div>
  </div>

  <footer class="footer" id="footer"></footer>

  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>initFirebase();</script>
  <script>
    try {
      var u = JSON.parse(localStorage.getItem('ph_user')||'null');
      if(!u || !u.uid){
        var id = new URLSearchParams(location.search).get('id') || '1';
        sessionStorage.setItem('ph_return', 'podcast.html?id=' + id);
        location.replace('login.html');
      }
    } catch(e) {
      sessionStorage.setItem('ph_return', location.pathname + location.search);
      location.replace('login.html');
    }
    function renderPage(){ renderPodcast(); }
    renderPodcast();
  </script>
</body>
</html>
